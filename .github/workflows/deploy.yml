name: Deploy

# Builds the web app and deploys it together with the graph tiles of a
# graph-build run and a fresh road-closures file to Cloudflare Pages (one
# project for app + tiles). Runs on push, daily, and after graph builds.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  # Daily redeploy with a fresh road-closures file (closures.json).
  schedule:
    - cron: "30 2 * * *"
  workflow_call:
    inputs:
      graph-run-id:
        description: "Run id of the graph build whose tiles to deploy (default: latest successful)"
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

env:
  PAGES_PROJECT: mopedmaps

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Always ship the latest app from main: when called by a graph build, the
      # caller's commit can be an hour old (the app was rolled back twice).
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build app
        working-directory: web
        run: |
          npm ci
          npm run build

      # Road closures (MobiData BW + Stadt Freiburg, dl-de/by-2-0), stdlib only.
      # Optional: without it the app simply routes without closures.
      - name: Fetch road closures
        continue-on-error: true
        run: PYTHONPATH=pipeline/src python3 -m mopedmaps_pipeline.closures web/dist/closures.json

      - name: Find graph build
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.graph-run-id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow graph-build.yml \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$RUN_ID" ]; then
            # Never replace the live site with one without map data.
            echo "::error::No successful graph build found - not deploying."
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download graph tiles
        uses: actions/download-artifact@v5
        with:
          name: graph-tiles
          path: web/dist/graph
          run-id: ${{ steps.graph.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ls dist | head
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch main || true
          npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
