name: Graph build

# Builds the routing graph tiles from OpenStreetMap (Geofabrik) + Copernicus
# GLO-30 elevation and deploys app + tiles to Cloudflare Pages.
# Measured locally for all of Germany: ~1 h, peak RAM 1.8 GB (docs/germany-build.md).

on:
  schedule:
    - cron: "0 2 3 * *" # 3rd of every month, 02:00 UTC
  workflow_dispatch:
    inputs:
      region:
        description: "Geofabrik region path (e.g. europe/germany or europe/germany/bremen for a quick test)"
        default: europe/germany
        required: true
      deploy:
        description: "Deploy to Cloudflare Pages after the build"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read # the called deploy workflow downloads the tiles artifact

concurrency:
  group: graph-build
  cancel-in-progress: false

jobs:
  build:
    name: Build graph tiles
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      REGION: ${{ inputs.region || 'europe/germany' }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline

      - name: Restore elevation tiles cache
        uses: actions/cache@v4
        with:
          path: data/dem
          key: dem-glo30-germany-v1

      - name: Fetch elevation tiles (Copernicus GLO-30)
        run: python -m mopedmaps_pipeline dem-fetch data/dem

      - name: Download OSM extract (Geofabrik)
        run: |
          mkdir -p data
          curl -fL --retry 3 -o data/source.osm.pbf "https://download.geofabrik.de/${REGION}-latest.osm.pbf"
          ls -lh data/source.osm.pbf

      # Traffic volume (BW counting stations, dl-de/by-2-0). The file name
      # contains a date, so resolve the current CSV via the CKAN API. Optional:
      # the build continues without it (edges then have DTV 0 = unknown).
      - name: Fetch traffic counts (Baden-Württemberg)
        id: traffic
        continue-on-error: true
        run: |
          url=$(curl -fsSL --retry 3 "https://mobidata-bw.de/api/3/action/package_show?id=karte_strassenverkehrszaehlung" \
            | python -c "import json,sys; r=json.load(sys.stdin)['result']['resources']; print(next(x['url'] for x in r if x['url'].lower().endswith('.csv')))")
          echo "$url"
          curl -fL --retry 3 -o data/traffic-bw.csv "$url"
          wc -l data/traffic-bw.csv

      # Traffic volume of other states published as section lines under open
      # licences (BY, NW, BB, SN, BE, HH; docs/research-data-germany.md).
      # Optional like the BW file; a failing state is skipped inside the script.
      - name: Fetch traffic counts (other states)
        continue-on-error: true
        run: python -m mopedmaps_pipeline.traffic_lines data/traffic-lines.jsonl.gz

      - name: Build tiles (streaming)
        run: |
          traffic=""
          if [ -s data/traffic-bw.csv ]; then traffic="--traffic data/traffic-bw.csv"; else echo "::warning::No BW traffic counts."; fi
          if [ -s data/traffic-lines.jsonl.gz ]; then traffic="$traffic --traffic data/traffic-lines.jsonl.gz"; else echo "::warning::No traffic section lines."; fi
          python -m mopedmaps_pipeline build data/source.osm.pbf data/graph \
            --streaming --dem data/dem --workdir data --delete-source --verify $traffic
          df -h .

      - uses: actions/upload-artifact@v4
        with:
          name: graph-tiles
          path: data/graph
          retention-days: 90
          if-no-files-found: error

  deploy:
    name: Deploy app + tiles
    needs: build
    if: ${{ github.event_name == 'schedule' || inputs.deploy }}
    uses: ./.github/workflows/deploy.yml
    with:
      graph-run-id: ${{ github.run_id }}
    secrets: inherit
