name: Keep schedules alive

# GitHub disables scheduled workflows in public repositories after 60 days
# without repository activity. This re-enables the scheduled workflows weekly
# via the API (no commits), so the daily closures deploy and the monthly graph
# build keep running even when nobody pushes for a while.

on:
  schedule:
    - cron: "15 3 * * 1" # Mondays 03:15 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in deploy.yml graph-build.yml keepalive.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" && echo "enabled $wf"
          done
          gh workflow list --repo "$GITHUB_REPOSITORY" --all
